# Alpha Factory — Validated Alpha Registry
#
# Authoritative list of alphas that have passed L3 validation and are
# eligible for L4 portfolio combination. Each entry corresponds to a
# RUN_REGISTRY row with status='validated' AND a documented audit doc
# under `docs/alphas/<id>.md`.
#
# `status` values:
#   pass               — all gates passed without caveats
#   pass-with-caveats  — gates passed but documented caveats apply;
#                        Phase D paper-trade gating still required
#   on_deck            — exists in registry but NOT portfolio-eligible;
#                        waiting on a defined trigger condition
#                        (e.g., paper-trade evidence on the head-of-
#                        family) before re-evaluation
#   deferred           — pushed back without a defined re-evaluation
#                        trigger; remains in registry for audit only;
#                        promote requires explicit user decision
#   suspended          — temporarily withheld pending V-next fix
#   failed             — gates rejected; do NOT enter L4
#
# Forward-Sharpe entries follow CLAUDE.md "× 0.3-0.5 haircut" rule and
# are sourced from the most recent rolling 12-24m window, NOT the
# full backtest aggregate (see audit docs for derivation).

alphas:
  - strategy_id: carry_v2
    variant: default
    status: pass-with-caveats
    audit_doc: docs/alphas/carry_v2.md

    # Most recent validated run on real archive
    validation_run_id: dce76976-e9d7-4905-9b0d-48a27f6ef1bb
    data_version: "2026-05-03T05:00+nocorr"
    validated_at: "2026-05-03"

    # Backtest headline (full 6.6-year sample on real BTC archive)
    backtest:
      n_obs: 57858
      sharpe_full_sample: 3.3748
      sharpe_excl_2021_2024: 2.4070   # outlier-corrected
      sharpe_last_12m: 2.8774          # forward-anchor base
      sortino: 4.86
      calmar: 2.71
      max_dd: -0.0189
      max_dd_duration_days: 141
      hit_rate: 0.5010
      kurt_excess: 1576.76
      skew: -3.06
      n_transitions: 6
      pct_active: 0.9624
      capacity_estimate_usd: 78331370

    # Forward-Sharpe anchor (anchored to recent 12m × haircut)
    forward_sharpe:
      anchor_window: "last_12m"
      anchor_sharpe: 2.8774
      haircut_low: 0.3
      haircut_high: 0.5
      forward_low: 0.86
      forward_high: 1.44
      project_md_target: 0.75       # carry-alone target
      meets_target: true

    # Validation gates
    gates:
      dsr_full_sample: 1.0000
      dsr_full_sample_n_trials_100: 0.999991
      dsr_recent_12m_n_trials_100: 0.625017
      dsr_passes: true
      pbo: null                      # N/A for single-params; Phase B sweep will compute
      pbo_passes: null
      max_dd_passes: true
      regime_pre_etf_sharpe: 3.49
      regime_post_etf_sharpe: 4.63
      regime_bull_sharpe: 4.27
      regime_bear_sharpe: 2.22
      regime_gates_pass: true
      corrections_diff_status: clean

    # Caveats from 3-phase adversarial audit (A.5.3)
    caveats:
      - id: recent_3m_negative
        severity: blocking_for_live
        message: |
          Last 3-month Sharpe is -0.95 (ann_ret -0.48%). Strategy may be
          structurally compressed in current regime. Track rolling 3m
          monthly; if Q3-2026 continues negative, revoke the verdict.

      - id: v3_funding_compression_detector_missing
        severity: required_for_phase_d
        message: |
          V2 detects only absolute negative-funding regimes (caught COVID,
          FTX correctly). Does not detect funding compression toward zero,
          which is the current 2025-2026 threat. V3 should add e.g.
          30d-MA < 0.5bp/8h -> exit. Phase B follow-up.

      - id: sample_bias_2021_2024
        severity: documentation
        message: |
          2021 (Sharpe 5.81) and 2024 (Sharpe 6.51) are leverage-froth
          outlier years. Excluding both, full-sample Sharpe drops to 2.41.
          Cross-strategy comparisons should quote the 2.41 figure.

      - id: post_etf_anomaly
        severity: documentation
        message: |
          post_etf Sharpe (4.63) > pre_etf (3.49) is misleading -- post_etf
          mean is HALF, std is one-third. Sharpe rises only because std
          collapsed faster. Dollar return economically halved post-ETF.

      - id: dsr_recent_window_required
        severity: pipeline
        message: |
          Full-sample DSR is uninformatively close to 1.0 even at
          n_trials=1000. Phase B sweep should compute DSR on rolling
          18-24m windows, not full archive.

      - id: superseded_by_carry_v3
        severity: structural
        message: |
          Phase B PBO sweep (2026-05-03, scripts/v3_pbo_sweep.py)
          enumerated 18 V3 trials = {0.05,0.1,0.15,0.2,0.3,0.5} bp x
          {60,90,120}d. Best trial (0.05 bp / 120d) ties-or-beats V2
          in all 4 windows {full, 12m, 3m, post-ETF}; PBO=0.30 < 0.5
          PASS gate; Sharpe surface FLAT at lookback=120d (range 0.27).
          For L4 portfolio construction, USE carry_v3 (post-sweep
          defaults). V2 backtest record retained for audit + cross-
          check; not portfolio-eligible.

      - id: dsr_recent_window_required
        severity: pipeline
        message: |
          Full-sample DSR is uninformatively close to 1.0 even at
          n_trials=1000. Phase B sweep should compute DSR on rolling
          18-24m windows, not full archive.

    # Supersession (V2 -> V3 post-sweep)
    superseded_by: carry_v3
    superseded_run_id: 053ee062-5285-4936-b991-6d5cf7839c51

    # Phase D gating (must satisfy ALL before live capital)
    phase_d_gates:
      - "rolling_3m_sharpe > 0 for 2 consecutive months"
      - "V3 funding-compression detector landed AND backtested"  # DONE 2026-05-03
      - "V3 PBO sweep selects threshold AND V3 dominates V2 on post-ETF"  # DONE 2026-05-03
      - "3-month paper trading on Binance API with < 30% tracking error"
      - "live capital cap $1k initially"

    # Position sizing hint for L4 HRP (per-strategy weight cap)
    # NOTE: V2 superseded; portfolio_hint here retained for audit
    portfolio_hint:
      max_weight: 0.50               # CLAUDE.md red line
      forward_vol_estimate: 0.06     # ann vol approx; refine in Phase C
      orthogonality_to_btc_directional: high   # delta-neutral
      portfolio_eligible: false      # V3 takes the carry slot post-sweep

  - strategy_id: carry_v3
    variant: v3-post-sweep-defaults
    status: pass-with-caveats
    audit_doc: docs/alphas/carry_v3.md

    # Post-PBO-sweep run with locked defaults (exit=0.05 bp/8h, lookback=120d)
    validation_run_id: 053ee062-5285-4936-b991-6d5cf7839c51
    data_version: "2026-05-03T05:00+nocorr"
    validated_at: "2026-05-03"

    # Relationship to V2 (V3 supersedes V2 post-sweep)
    supersedes: carry_v2
    portfolio_eligible: true
    sweep_summary:
      script: scripts/v3_pbo_sweep.py
      grid: "6 thresholds {0.05,0.1,0.15,0.2,0.3,0.5} bp x 3 lookbacks {60,90,120}d = 18 trials"
      best_trial: "exit=0.05 bp / lookback=120d"
      pbo: 0.3035
      pbo_gate_pass: true              # 0.30 < 0.5
      sharpe_surface_at_120d_lookback: "FLAT (range 0.27 across thresholds)"
      n_dominance_windows: "4/4 ties-or-beats V2 (full / 12m / 3m / post-ETF)"

    relation_to_v2: |
      V3 = V2 + funding-compression detector + ratchet guard. V3 closes
      the V2 caveat 'v3_funding_compression_detector_missing'. After
      Phase B PBO sweep on 2026-05-03, V3 best trial (0.05 bp / 120d)
      ties-or-beats V2 in all 4 backtest windows; PBO=0.30 < 0.5 PASS;
      Sharpe surface at lookback=120d is FLAT across thresholds. V3
      now supersedes V2 in L4 portfolio (V2 retained for audit only).

    # Backtest headline (post-sweep defaults, full 6.6-year sample)
    backtest:
      n_obs: 57858
      sharpe_full_sample: 3.341         # V2: 3.375 (delta -0.034, within noise)
      sharpe_last_12m: 3.307            # V2: 2.850 (delta +0.456 ✓)
      sharpe_last_3m: -0.874            # V2: -0.946 (delta +0.072 ✓; still negative)
      sharpe_post_etf: 4.737            # V2: 4.628 (delta +0.109 ✓)
      max_dd: -0.0189
      active_fraction: 0.90             # vs V2's 0.96 (-6pp)
      n_transitions: 14                 # vs V2's 6
      final_equity: ~1390               # essentially equal to V2 ($1391)

    # Forward-Sharpe anchor (anchored to recent 12m × haircut)
    forward_sharpe:
      anchor_window: "last_12m"
      anchor_sharpe: 3.307
      haircut_low: 0.3
      haircut_high: 0.5
      forward_low: 0.99
      forward_high: 1.65
      project_md_target: 0.75           # carry-alone target
      meets_target: true                # easily clears at both haircut ends

    # Validation gates
    gates:
      dsr_full_sample: 1.0000
      dsr_passes: true
      pbo_swept: 0.3035                 # 18-trial CSCV PBO from sweep
      pbo_passes: true                  # 0.30 < 0.5
      max_dd_passes: true
      regime_post_etf_sharpe: 4.737
      regime_gates_pass: true           # verdict=pass implies all 4 cleared
      corrections_diff_status: clean
      sharpe_surface_robust: true       # lookback=120d gap=0.27 < 1.0

    # Caveats specific to V3 (post-sweep, full text in docs/alphas/carry_v3.md)
    caveats:
      - id: last_3m_still_marginally_negative
        severity: documentation
        message: |
          V3 last-3m Sharpe is -0.87 (better than V2's -0.95 but still
          below 0). The 3m window is too short for the 30d compression
          detector to fully react. Acceptable per the ratchet guard
          (transitions are slow on purpose), but track monthly. If the
          3m Sharpe stays < -0.5 for 2+ consecutive months under V3,
          the threshold or lookback may need re-tuning.

      - id: v3_warmup_handicap
        severity: documentation
        message: |
          V3 default initial state is `exited` (vs V2's `active`),
          costing 30-60 days of carry at any cold-start backtest.
          For 6.6yr sample this is < 1.2% impact; for 1yr cold start
          the handicap can dominate. Mitigation: persist last state
          to registry across restarts (Phase B work item).

      - id: dsr_recent_window_required
        severity: pipeline
        message: |
          Inherited from V2: full-sample DSR saturates at 1.0 even with
          n_trials=1000. Rolling 18-24m DSR is more informative.

    # Phase D gating: V3 specific (in addition to common L4 gates)
    phase_d_gates:
      - "PBO sweep over {0.05, 0.1, 0.15, 0.2, 0.3, 0.5} bp picks threshold"  # DONE 2026-05-03
      - "V3 dominates V2 on post-ETF Sharpe at chosen threshold"   # DONE 2026-05-03
      - "Sharpe surface flat to +/-25% threshold movement"        # DONE (gap 0.27)
      - "Last-3m Sharpe >= 0 for >= 2 consecutive quarters at chosen threshold"  # PENDING
      - "3-month paper trading on Binance API with < 30% tracking error"
      - "live capital cap $1k initially"

    family: carry_v3                     # head-of-family (BTC); see carry_v3-eth + carry_v3-sol below
    family_role: primary_high_confidence

    # Position sizing hint for L4 HRP (V3 is now portfolio_eligible)
    portfolio_hint:
      max_weight: 0.50                  # CLAUDE.md red line, same as V2
      forward_vol_estimate: 0.05        # lower active_frac => lower realized vol
      orthogonality_to_btc_directional: high   # delta-neutral, same as V2
      v3_v2_correlation_estimate: ">= 0.9"   # NOT measured; assertion based
                                              # on shared legs + V2 exit path
                                              # inheritance. Phase B portfolio
                                              # step to measure.
      portfolio_eligible: true          # V3 takes carry slot post-sweep

