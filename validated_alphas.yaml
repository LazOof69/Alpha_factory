          18 parameter trials. Same observation on ETH (-1.26% across
          all 18). Indicates: V3 funding-compression detector affects
          EXIT timing but does not affect ENTRY/HOLDING during a price
          drawdown event. V3 does NOT defend against spot-price
          drawdown — only against funding compression. Phase D risk
          model must account for this.
